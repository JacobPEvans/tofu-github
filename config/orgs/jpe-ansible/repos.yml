# Per-repo overrides for jpe-ansible repositories managed by tofu-github.
repos:
  ansible-productivity-apps:
    visibility: public
    description: "Ansible project for productivity apps"
    topics:
      - ansible
  ansible-youtrack:
    visibility: public
    gitflow: true
    description: "Ansible collection for YouTrack configuration"
    topics:
      - ansible
      - ansible-collection
      - youtrack
  tofu-semaphore:
    visibility: public
    description: "OpenTofu for the Semaphore UI object graph: projects, repositories, inventories, environments, templates, schedules and views."
    topics:
      - ansible
      - opentofu
      - semaphore
