# Per-repo overrides for this organization. Schema: config/orgs/dryvist/repos.yml.
repos:
  cc-stream-raw-event-archive-io:
    visibility: public
    description: "Cribl Stream pack: archive every original event, unmodified, to S3-compatible object storage"
    topics:
      - archive
      - cribl
      - cribl-pack
      - cribl-stream
      - object-storage
  # Archived: the upstream pack installs unmodified from its own release; additions live in own packs.
  cribl-ubiquiti-syslog:
    visibility: public
    fork_of: criblpacks/cribl-ubiquiti-syslog
    description: "Unmodified fork of the Cribl Ubiquiti syslog pack (archived; install upstream releases)"
    topics:
      - cribl
      - cribl-pack
      - cribl-stream
      - ubiquiti
    archived: true
