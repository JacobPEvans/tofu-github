# The PR Reconcile sweep runs in sweep_repository and reconciles every open
# pull request of each listed owner. sweep_repository, claude_bot_app_id, and
# owners are required. Repositories listed in the PR_RECONCILE_EXCLUDE_REPOS secret are skipped.
sweep_repository: .github-ai
claude_bot_app_id: "2956476"
caller_repositories:
  - .github-ai
  - tofu-github
# Optional: the caller workflow the sweep starts for a pull request that fails
# a code check; a repository without that file is left alone.
ci_fix_workflow: openhands-ci-fix.yml
# Optional: true lets the sweep merge a bot pull request that is green at its
# exact head with a successful AI Merge Gate.
merge: true
owners:
  - JacobPEvans
  - dryvist
  - JacobPEvans-ai
  - jpe-nix
  - jpe-private
  - jpe-ansible
  - jpe-cribl
  - jpe-splunk
  - jpe-openbao-plugin-secrets
