# Required-check inventory: the org Merge Gate for each registered public repo.
#
# A repo is listed only when its most recent merged pull request reported the
# context on its head commit, from the GitHub Actions app. `gate` is the thin
# caller (`gate / Merge Gate`); `bare` is the inline alls-green job (`Merge Gate`).
# Repos reporting neither context are left out and stay ungated.
#
# Adding a repo to a list REQUIRES its check context to be live on every PR
# first. A required check that never reports blocks every PR in the repo.
#
# Private repos are not listed here. They join only through this owner's
# private overrides document, and requires_private_repos stays false, so this
# file does not require one.
merge_gate:
  requires_private_repos: false
  contexts:
    gate:
      context: "gate / Merge Gate"
      repos:
        - claude-code-plugins
        - merge-flow-fixture
        - merge-flow-fixture-consumer
    bare:
      context: "Merge Gate"
      repos:
        - mlx-benchmarks
