# Per-repo overrides for jpe-nix repositories managed by tofu-github.
# Rebase merging is off on every repository in the org.
allow_rebase_merge: false
repos:
  .github:
    visibility: public
    gitflow: false
    description: "Community defaults for composable Nix flakes."
    topics: []

  nix-herdr:
    visibility: public
    gitflow: false
    description: "Declarative Nix packages and modules for the Herdr terminal workspace manager and its optional components."
    topics:
      - agent-integrations
      - collie
      - herdr
      - home-manager
      - nix
      - nix-darwin
      - nix-flakes
      - nixos

  nix-ai:
    visibility: public
    gitflow: true
    allow_update_branch: true
    description: "Your AI coding toolkit, declared in Nix — Claude, Gemini, Copilot, 15+ MCP servers, one flake"
    topics:
      - ai
      - ai-tools
      - claude
      - claude-code
      - copilot
      - gemini
      - home-manager
      - mcp-server
      - nix
      - nix-flakes
      - ollama
