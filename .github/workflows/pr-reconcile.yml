---
name: PR Reconcile

# A push to a base branch reconciles every open pull request on it: BEHIND gets
# update-branch, DIRTY gets the merge-conflict label. Each eligible conflicted pull
# request is queued once per head commit, and the conflict-fix job opens a v2 of it
# on the current base.
on:
  push:
    branches: [develop, main]

permissions: {}

jobs:
  reconcile:
    permissions:
      contents: read
    uses: JacobPEvans/.github-ai/.github/workflows/pr-reconcile.yml@9d36013139b71088bcf4e687cadf56e77451e47d # v2.35.0
    secrets: inherit
    with:
      base_ref: ${{ github.ref_name }}
      conflict_fix: true

  conflict-fix:
    needs: reconcile
    if: needs.reconcile.outputs.conflict_prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.reconcile.outputs.conflict_prs) }}
    # The called workflow's jobs request exactly these scopes.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: JacobPEvans/.github-ai/.github/workflows/cc-conflict-fix.yml@9d36013139b71088bcf4e687cadf56e77451e47d # v2.35.0
    secrets: inherit
    with:
      conflict_pr: ${{ matrix.pr }}
      runner_label: review
      agent: openhands
      local_model: medium
      repo_context: "OpenTofu configuration for GitHub organizations and repositories"
      ci_structure: "CI Gate aggregates the repository's lint, test and contract checks."
